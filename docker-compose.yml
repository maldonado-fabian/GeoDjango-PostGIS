
services:

  postgis:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: GRD_Docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: izipizi123
    ports:
      - "5435:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src/geodjango:/app/src/geodjango
      # Solo lectura: lo usa el test de paridad de umbrales, que compara los
      # cortes de riesgo de main.js contra los del backend (api/tests/test_umbrales.py).
      - ./src/mapa:/app/src/mapa:ro
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: GRD_Docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: izipizi123
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python3 src/geodjango/manage.py runserver 0.0.0.0:8000"

  celery:
    build: .
    volumes:
      - ./src/geodjango:/app/src/geodjango
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: GRD_Docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: izipizi123
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "cd src/geodjango && celery -A geodjango worker -l info"

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    container_name: pg_tileserv
    env_file:
      - pg_tileserv.env
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "7800:7800"
  
  pg_fetureserv:
    image: pramsey/pg_featureserv:latest
    container_name: pg_featureserv
    env_file:
      - pg_featureserv.env
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "9000:9000"