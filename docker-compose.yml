
services:

  postgis:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: GRD_Docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: izipizi123
    ports:
      - "5435:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src/geodjango:/app/src/geodjango
      # Solo lectura: lo usa el test de paridad de umbrales, que compara los
      # cortes de riesgo de main.js contra los del backend (api/tests/test_umbrales.py).
      - ./src/mapa:/app/src/mapa:ro
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: GRD_Docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: izipizi123
      # DATABASE_* (no POSTGRES_*) es lo que lee settings.py y api/reports/queries.py
      # -hallazgo de la validación de portabilidad, 2026-09-08: sin esto, Django
      # falla con "settings.DATABASES is improperly configured" y el reporte PDF
      # falla por separado en su propia conexión SQLAlchemy. Duplicado a propósito
      # con las POSTGRES_* de arriba en vez de reemplazarlas, porque pg_tileserv.env
      # / pg_featureserv.env están escritos en términos de POSTGRES_*.
      DATABASE_ENGINE: django.contrib.gis.db.backends.postgis
      DATABASE_HOST: postgis
      DATABASE_PORT: 5432
      DATABASE_NAME: GRD_Docker
      DATABASE_USER: postgres
      DATABASE_PASSWORD: izipizi123
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    # migrate + create_roles antes de runserver: hallazgo de la validación de
    # portabilidad (2026-09-08) — antes había que correrlos a mano, y
    # "migrate" ni siquiera aparecía documentado en ningún lado. Sigue sin
    # cubrir sql/00_schema.sql ni sql/*_amenaza_*.sql (esos no son de Django,
    # ver sql/README.md) ni la carga de inmuebles/evaluaciones.
    command: >
      sh -c "python3 src/geodjango/manage.py migrate &&
             python3 src/geodjango/manage.py create_roles &&
             python3 src/geodjango/manage.py ensure_admin &&
             python3 src/geodjango/manage.py runserver 0.0.0.0:8000"

  celery:
    build: .
    volumes:
      - ./src/geodjango:/app/src/geodjango
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: GRD_Docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: izipizi123
      # DATABASE_* (no POSTGRES_*) es lo que lee settings.py y api/reports/queries.py
      # -hallazgo de la validación de portabilidad, 2026-09-08: sin esto, Django
      # falla con "settings.DATABASES is improperly configured" y el reporte PDF
      # falla por separado en su propia conexión SQLAlchemy. Duplicado a propósito
      # con las POSTGRES_* de arriba en vez de reemplazarlas, porque pg_tileserv.env
      # / pg_featureserv.env están escritos en términos de POSTGRES_*.
      DATABASE_ENGINE: django.contrib.gis.db.backends.postgis
      DATABASE_HOST: postgis
      DATABASE_PORT: 5432
      DATABASE_NAME: GRD_Docker
      DATABASE_USER: postgres
      DATABASE_PASSWORD: izipizi123
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "cd src/geodjango && celery -A geodjango worker -l info"

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    # Sin container_name fijo: hallazgo de la validación de portabilidad
    # (2026-09-08) — un nombre literal (antes "pg_tileserv") es único a nivel
    # de todo el daemon Docker, no por proyecto, así que impedía tener dos
    # instancias de este stack en la misma máquina, incluso en directorios
    # distintos. Sin esta línea, Compose genera un nombre con el prefijo del
    # proyecto, igual que ya hace para django/celery/postgis/redis.
    env_file:
      - pg_tileserv.env
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "7800:7800"
  
  pg_fetureserv:
    image: pramsey/pg_featureserv:latest
    env_file:
      - pg_featureserv.env
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "9000:9000"